baseURL = 'https://go-blas.github.io/'
locale  = 'en-us'
title   = 'go-blas'
# No theme -- the layout is the go-* family template go-ndarray.github.io uses:
# one self-contained layouts/index.html; the design (styles, theme toggle, fork
# ribbon and the Digital Commons band, icons, the hero's buttons) comes from the
# shared Hugo module github.com/go-fleettools/landingkit.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

# Its version is pinned in go.mod, and kit.go keeps `go mod tidy` from deleting
# that requirement. A file of the same name under layouts/partials/ would
# silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-blas is a pure-Go BLAS with the Fortran reference signatures, column-major: real (float32/float64) level 1, gemv and gemm, a SIMD GEMM on six architectures, an error bound stated per routine and checked against a 256-bit oracle, and a netlib-exact option. Argument errors are returned, never panics."

# The hero's buttons: rendered by the kit's cta.html, in the kit's order.
# There is no documentation site yet, so the source is the primary reading.
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-blas/blas"
  label = "Read the source on GitHub"
[[params.cta]]
  kind  = "link"
  href  = "https://github.com/go-blas/blas/blob/v0.1.0/docs/design.md"
  label = "Read the design"

[[params.repos]]
  name  = "blas"
  kind  = "library · v0.1.0"
  href  = "https://github.com/go-blas/blas"
  blurb = "The library. Real-type BLAS with the Fortran reference signatures, column-major: <code>Dgemm</code>/<code>Sgemm</code>, <code>Dgemv</code>/<code>Sgemv</code> and level 1, each returning an <code>error</code>. <code>Dgemm</code> and <code>Sgemm</code> run on a packed, cache-blocked, multicore SIMD kernel; package <code>netlib</code> has the same routines as plain-Go ports of reference BLAS 3.12."

# No [params.brand]: there is no go-blas/brand repository and no logo yet, so
# the page uses the kit's neutral defaults. The brand block is READ from a
# logo's gradient (`landingkit brand static/img/logo.svg`), never chosen; add it
# when the logo exists.

# The API cards (#api) and the count in the hero come from this list, never
# from a number typed beside it.
[[params.families]]
  name = "Level 3"
  what = "`Dgemm` and `Sgemm`: `C := alpha*op(A)*op(B) + beta*C` with every transpose combination, leading dimensions, and the reference's scalar rules (`beta = 0` never reads C, `alpha = 0` never reads A or B)."
[[params.families]]
  name = "Level 2"
  what = "`Dgemv` and `Sgemv`, with increments, negative ones included."
[[params.families]]
  name = "Level 1"
  what = "`Sdot`/`Ddot`, `Saxpy`/`Daxpy`, `Sscal`/`Dscal`, `Snrm2`/`Dnrm2`, `Sasum`/`Dasum` and `Isamax`/`Idamax`, which returns the 1-based Fortran index."
[[params.families]]
  name = "Reference signatures"
  what = "One Go routine per Fortran routine, parameter for parameter, column-major, so that a Fortran ABI shim (julia's libblastrampoline, for one) can call them exactly."
[[params.families]]
  name = "Errors, not panics"
  what = "Each routine returns nil or a `*blas.ArgError{Routine, Param}` carrying xerbla's parameter number. Every slice is checked against the length the call needs, with overflow-safe arithmetic that also holds on 32-bit targets."
[[params.families]]
  name = "A stated error bound"
  what = "Each routine states an elementwise bound, asserted in the tests against a `math/big` oracle of 256 bits. Inside it, FMA, packing, blocking and reordered sums are all used; bit identity with netlib is not promised."
[[params.families]]
  name = "SIMD GEMM"
  what = "A packed, cache-blocked, multicore kernel: AVX2/FMA, NEON, VSX, LASX, RVV and the z vector facility, go-asmgen micro-kernels per architecture."
[[params.families]]
  name = "netlib, the exact option"
  what = "`github.com/go-blas/blas/netlib`: plain-Go ports of reference BLAS 3.12 in the reference's loop order and without fused multiply-add, so the results are the same on every architecture. The equality oracle of the tests; not fast."

# The architectures the tests RUN on, read from the library's README: natively
# on amd64 and arm64, under qemu on the others.
[params.mantra]
  goarch = ["amd64", "arm64", "riscv64", "loong64", "ppc64le", "s390x", "arm"]
